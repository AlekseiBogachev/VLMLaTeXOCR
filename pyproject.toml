[project]
name = "vlmlatexocr"
version = "0.1.0"
description = "Vision-language model that converts handwritten formulas into LaTeX format."
authors = [
    {name = "Aleksei Bogachev",email = "bogachev.aleksey.m@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy (>=2,<3)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "torch (>=2.10.0,<3.0.0)",
    "transformers (>=5.3.0,<6.0.0)",
    "datasets (>=4.8.3,<5.0.0)",
    "accelerate (>=1.13.0,<2.0.0)",
    "timm (>=1.0.25,<2.0.0)",
    "peft (>=0.18.1,<0.19.0)",
    "evaluate (>=0.4.6,<0.5.0)",
    "pillow (>=11,<12)",
    "jiwer (>=4.0.0,<5.0.0)",
    "bitsandbytes (>=0.49.2,<0.50.0)",
    "trackio (>=0.20.2,<0.21.0)"
]

[dependency-groups]
dev = [
    "ruff (>=0.15.7,<0.16.0)",
    "jupyterlab (>=4.5.6,<5.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "ipywidgets (>=8.1.8,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "cuda_pytorch"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"


[[tool.poetry.source]]
name = "cpu_pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "cuda_pytorch"}
